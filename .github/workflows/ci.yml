# Runs the required checks listed in AGENTS.md on every push and pull request.
#
# macOS runners match the development platform: the default `native` feature
# set enables Burn's Metal/WGPU backend. Tests needing an actual Metal device
# are `#[ignore]`d, so no GPU is required here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      - name: Documentation
        run: cargo doc --no-deps
