# Runs the required checks listed in AGENTS.md on every push and pull request.
#
# macOS runners match the development platform: the default `native` feature
# set enables Burn's Metal/WGPU backend. Tests needing an actual Metal device
# are `#[ignore]`d, so no GPU is required here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      - name: Documentation
        run: cargo doc --no-deps

  wasm:
    runs-on: macos-latest
    strategy:
      matrix:
        backend: [flex, webgpu]
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain and WASM target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # These backends are mutually exclusive; --all-features cannot check them.
      - name: Check browser backend
        run: cargo clippy --locked -p yokai-web --target wasm32-unknown-unknown --no-default-features --features ${{ matrix.backend }} -- -D warnings
