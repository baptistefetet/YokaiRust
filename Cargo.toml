[package]
name = "yokai"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A fast, testable Rust implementation of Yokai No Mori 3x4"
license = "MIT"

[dependencies]
rand = "=0.10.2"
rand_chacha = "=0.10.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"

[dev-dependencies]
proptest = "=1.11.0"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
