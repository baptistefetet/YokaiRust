[package]
name = "yokai"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A fast, testable Rust implementation of Yokai No Mori 3x4"
license = "MIT"

[dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "train", "store", "metal", "flex", "fusion", "autotune"] }
crossbeam-channel = "=0.5.16"
rand = "=0.10.2"
rand_chacha = "=0.10.0"
rand_distr = "=0.6.0"
ratatui = "=0.30.2"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
toml = "=1.1.4"

[dev-dependencies]
proptest = "=1.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
