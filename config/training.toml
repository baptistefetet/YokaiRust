seed = 42
backend = "metal"

[network]
filters = 64
residual_blocks = 4
value_hidden = 64

[self_play]
games_per_generation = 256
workers = 16
simulations = 400
max_game_plies = 512
inference_batch_size = 128
inference_wait_ms = 2
