[package]
name = "yokai-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["flex"]
flex = ["burn/flex"]
webgpu = ["burn/wgpu"]

[dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
console_error_panic_hook = "=0.1.7"
js-sys = "=0.3.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
yokai = { path = "../..", default-features = false, features = ["web"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
