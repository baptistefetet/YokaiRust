<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Play the 5×6 game of Yokai No Mori against the Rust AlphaZero engine or a friend, directly in your browser.">
    <link rel="apple-touch-icon" href="./favicon.png" sizes="any" type="image/png">
    <link rel="icon" href="./favicon.png" sizes="any" type="image/png">
    <link rel="stylesheet" href="./app.css">
    <title>Yokai No Mori</title>
</head>
<body>
    <main id="app">
        <div id="game" aria-label="Yokai No Mori board"></div>
        <a id="about" href="https://github.com/baptistefetet/YokaiRust" target="_blank" rel="noopener" title="Source code on GitHub">
            <span id="release-version">@RELEASE_VERSION@</span>
            <svg viewBox="0 0 16 16" width="18" height="18" role="img" aria-label="source code on GitHub">
                <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
        </a>
        <section id="loading" role="status" aria-live="polite">
            <img src="./assets/images/logo.png" alt="" width="64" height="64">
            <p id="loading-title">Loading the Rust engine…</p>
            <p id="loading-detail">The champion is loaded and runs locally in your browser.</p>
        </section>
        <section id="menu" aria-labelledby="menu-title" hidden>
            <form id="menu-form">
                <div class="menu-header">
                    <h1 id="menu-title">New game</h1>
                    <a id="rules-link" href="https://cdn.1j1ju.com/medias/b8/2f/eb-yokai-no-mori-rulebook.pdf" target="_blank" rel="noopener" title="Official rulebook in English (PDF): this 5×6 game is its expert version">Rules</a>
                </div>
                <fieldset>
                    <legend>Players</legend>
                    <label>
                        <input type="radio" name="players" value="1" checked>
                        <span>One player <small>You play the bottom side against the champion.</small></span>
                    </label>
                    <label>
                        <input type="radio" name="players" value="2">
                        <span>Two players <small>Both players share this screen, face to face.</small></span>
                    </label>
                </fieldset>
                <div class="menu-actions">
                    <button type="button" id="menu-cancel">Back to the game</button>
                    <button type="submit">Start</button>
                </div>
            </form>
        </section>
        <section id="fatal-error" role="alert" hidden>
            <h1>The engine could not start</h1>
            <p id="fatal-error-message"></p>
            <button type="button" id="reload-button">Try again</button>
        </section>
    </main>
    <script src="./vendor/phaser.min.js"></script>
    <script type="module" src="./main.js"></script>
</body>
</html>
